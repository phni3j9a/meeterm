const paths={arrow:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M18 6 6 18',server:'M5 3h14v7H5zM5 14h14v7H5zM8 6.5h.01M8 17.5h.01M12 6.5h4M12 17.5h4',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',terminal:'m5 7 5 5-5 5M13 17h6',settings:'M4 7h16M4 17h16M8 4v6M16 14v6',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6',clock:'M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',layers:'m12 3 10 6-10 6L2 9zM2 13l10 6 10-6M2 17l10 6 10-6',keyboard:'M2 5h20v14H2zM5 9h1M9 9h1M13 9h1M17 9h2M5 12h1M9 12h1M13 12h1M17 12h2M7 16h10',up:'m6 14 6-6 6 6M12 8v12',down:'m6 10 6 6 6-6M12 4v12',return:'M19 5v9H5m5-5-5 5 5 5',link:'M9 8 7 6a4 4 0 0 0-5 6l5 5a4 4 0 0 0 6-5M15 16l2 2a4 4 0 0 0 5-6l-5-5a4 4 0 0 0-6 5',info:'M12 11v6M12 7h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',refresh:'M20 7a9 9 0 1 0 1 8M20 2v6h-6',disconnect:'m3 3 18 18M8 8a6 6 0 0 0 0 8M16 8a6 6 0 0 1 1 5M4 5a10 10 0 0 0 0 14M20 5a10 10 0 0 1 2 10',type:'M4 4h16M12 4v16M8 20h8',check:'m5 12 4 4L19 6',folder:'M3 6h7l2 3h9v11H3z',spark:'m12 3 2 6 6 3-6 2-2 7-2-7-7-2 7-3z'};
const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.terminal}"/></svg>`;
const mark=`<svg class="mark" width="31" height="36" viewBox="0 0 36 44" fill="none" aria-hidden="true"><path d="M10 12C5 12 6 5 11 6l3 2q4-2 8 0l3-2c5-1 6 6 1 7 2 5-1 9-2 12l1 12H11l1-12c-3-4-4-9-2-13Z" fill="currentColor" opacity=".13"/><path d="M10 12C5 12 6 5 11 6l3 2q4-2 8 0l3-2c5-1 6 6 1 7 2 5-1 9-2 12l1 12H11l1-12c-3-4-4-9-2-13Z" stroke="currentColor" stroke-width="1.6"/><path d="m11 17 4 2m10-2-4 2m-5 3h4l-2 3-2-3Zm-2 8 4 2 4-2M9 38h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
document.querySelectorAll('[data-mark]').forEach(el=>el.innerHTML=mark);
document.querySelectorAll('[data-arrow]').forEach(el=>el.innerHTML=icon('arrow'));
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(action,label,name,extra='')=>`<button class="icon-btn" data-action="${action}" aria-label="${label}" title="${label}" ${extra}>${icon(name)}</button>`;
const stateLabel={running:'実行中',waiting:'入力待ち',idle:'待機',done:'完了'};
const stateClass=s=>s==='running'?'running':(s==='waiting'||s==='done')?'waiting':'idle';
const pill=(s,label)=>`<span class="pill ${stateClass(s)}"><span class="dot"></span>${esc(label||stateLabel[s])}</span>`;
const pane=(id,name,status,kind)=>({id,name,status,kind,draft:'',history:[],historyIndex:0});
function seed(){return [{id:'home',name:'Home lab',address:'home.example',user:'dev',port:22,known:true,connected:false,windows:[{id:'meeterm',name:'meeterm',active:'p1',panes:[pane('p1','Codex','running','codex'),pane('p2','Shell','idle','shell'),pane('p3','Tests','done','tests')]},{id:'rfkit',name:'rfkit-rs',active:'p4',panes:[pane('p4','Codex','waiting','review'),pane('p5','Shell','idle','shell')]},{id:'sekirei',name:'sekirei-weight',active:'p6',panes:[pane('p6','Shell','idle','shell')]}]},{id:'devbox',name:'Dev box',address:'dev.example',user:'dev',port:22,known:true,connected:false,windows:[{id:'sandbox',name:'sandbox',active:'p7',panes:[pane('p7','Shell','idle','shell')]}]}]}
let servers=seed(),serverId='home',workspaceId='meeterm',seq=20,fontSize=12,keyboardOpen=false,ctrl=false,toastTimer;
const app=document.getElementById('app'),sheet=document.getElementById('sheet');
const getServer=()=>servers.find(s=>s.id===serverId)||servers[0];
const getWorkspace=()=>getServer()?.windows.find(w=>w.id===workspaceId);
const getPane=()=>getWorkspace()?.panes.find(p=>p.id===getWorkspace().active);
function route(){return ['servers','workspaces','terminal','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'servers'}
function navigate(page){keyboardOpen=false;ctrl=false;if(location.hash===`#${page}`)render();else location.hash=page}
function toast(message){clearTimeout(toastTimer);document.getElementById('toast').textContent=message;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3300)}
function demoLine(){return '<div class="demo-line">INTERACTIVE MOCK · NO REAL CONNECTION</div>'}
function bottomNav(active){return `<nav class="bottom-nav" aria-label="メインナビゲーション"><button data-action="navigate" data-value="servers" class="${active==='servers'?'active':''}" ${active==='servers'?'aria-current="page"':''}>${icon('server')}接続先</button><button data-action="navigate" data-value="settings" class="${active==='settings'?'active':''}" ${active==='settings'?'aria-current="page"':''}>${icon('settings')}設定</button></nav>${demoLine()}`}
function renderServers(){return `<section class="screen"><header class="toolbar"><div class="wordmark">${mark}meeterm</div>${button('add-host','接続先を追加','plus')}</header><div class="scroll"><div class="title-block"><h1 tabindex="-1">いつもの場所へ。</h1><p>サーバーを選んで、作業の続きを。</p></div><div class="section-label"><span>SSH 接続先</span><span class="count">${String(servers.length).padStart(2,'0')}</span></div><div class="content-pad">${servers.map((s,i)=>`<button class="host-card ${i===0?'featured':''}" data-action="connect" data-id="${s.id}"><div class="host-top"><span class="server-icon">${icon('server')}</span><div><div class="host-title">${esc(s.name)}</div><div class="host-address">${esc(s.user)}@${esc(s.address)}</div></div>${icon('arrow','chevron')}</div><div class="host-meta"><span class="mini">${icon(s.connected?'link':'clock')}${s.connected?'接続中（デモ）':i===0?'前回の接続先':'保存済み'}</span><span>${s.windows.length} Workspaces</span></div>${i===0?`<div class="host-workspaces">${s.windows.map(w=>esc(w.name)).join(' · ')||'Workspaceはまだありません'}</div>`:''}</button>`).join('')}<button class="dashed-add" data-action="add-host">${icon('plus')}接続先を追加</button></div><div class="quiet-note">${icon('shield')}<span>スマホを閉じても、作業はサーバーで続きます。<br>次は、同じWorkspaceから。</span></div></div>${bottomNav('servers')}</section>`}
function workspaceStatus(w){const p=w.panes.find(p=>p.status==='running')||w.panes.find(p=>p.status==='waiting');return p?pill(p.status,`${p.name} ${stateLabel[p.status]}`):pill('idle','待機中')}
function renderWorkspaces(){const s=getServer(),lastId=s.lastWorkspace||s.windows[0]?.id;return `<section class="screen"><header class="toolbar"><button class="nav-label" data-action="navigate" data-value="servers">${icon('back')}接続先</button><button class="host-context" data-action="connection" aria-label="接続状態を確認"><span class="dot"></span>${s.connected?'接続中':'未接続'} ${icon('arrow')}</button></header><div class="scroll"><div class="title-block"><div class="eyebrow muted" style="margin-bottom:8px">${esc(s.name)}</div><h1 tabindex="-1">Workspaces</h1><p>いつもの作業が、ここに。<br><span class="mono" style="font-size:10px">tmux / meeterm</span></p></div><div class="section-label"><span>すべてのWorkspace</span><span class="count">${String(s.windows.length).padStart(2,'0')}</span></div><div class="content-pad">${s.windows.length?s.windows.map((w,i)=>`<button class="workspace ${w.id===lastId?'last':''}" data-action="open-workspace" data-id="${w.id}"><div class="workspace-head"><span class="workspace-icon">${esc(w.name[0])}</span><div><div class="workspace-name">${esc(w.name)}</div><div class="workspace-sub">${w.id===lastId?'前回のWorkspace':'保存された作業'}</div></div>${icon('arrow')}</div><div class="workspace-foot">${workspaceStatus(w)}<span class="pane-count">${icon('layers')}${w.panes.length} panes</span></div></button>`).join(''):`<div class="empty">${icon('folder')}<h2>新しい作業をはじめる</h2><p>Workspaceを作成すると、<br>meetermセッションで作業を始められます。</p></div>`}<button class="dashed-add" data-action="add-workspace" ${s.connected?'':'disabled'}>${icon('plus')}Workspaceを追加</button></div></div><div class="workspace-footer">${icon('info')}<span>Workspace = tmux window<br>PCでも同じセッションに戻れます。</span></div>${demoLine()}</section>`}
function sampleOutput(p,w){const name=esc(w.name);switch(p.kind){case 'codex':return `<span class="line-label">CODEX</span> <span class="dim">~/projects/${name}</span>\n<span class="prompt-card">› スマホ向けの画面を整えて</span><span class="accent">● Working</span>\n<span class="dim">  Navigation と pane tabs を確認中。</span>\n<span class="term-section">Explore</span><span class="success">✓</span> Read App.tsx\n<span class="success">✓</span> Check workspace navigation\n<span class="success">✓</span> Keep terminal data native\n<span class="term-section">Changes</span>  シンプルなWorkspace一覧\n  pane名と状態をタブに表示\n  戻る操作ではpaneを維持\n<span class="term-divider"></span><span class="dim">  3 files changed · +42 −18\n  Reviewing the interaction flow…</span>\n\n<span class="accent">  ◦ Working on your workspace</span>`;case 'review':return `<span class="line-label">CODEX</span> <span class="dim">~/projects/${name}</span>\n<span class="prompt-card">› 次の変更をレビューして</span><span class="success">✓</span> サンプルのレビューが完了しました。\n\n公開APIの変更方針を確認してください。\n<span class="term-divider"></span><span class="accent">? あなたの入力を待っています。</span>\n<span class="dim">  デモ入力欄にメッセージを送れます。</span>`;case 'tests':return `<span class="dim">~/projects/${name}</span>\n<span class="accent">❯</span> npm test\n\n<span class="success">PASS</span> workspace-navigation.test\n  <span class="success">✓</span> opens the selected workspace\n  <span class="success">✓</span> preserves pane selection\n\n<span class="success">PASS</span> terminal-tabs.test\n  <span class="success">✓</span> switches without disconnecting\n  <span class="success">✓</span> confirms before closing\n\n<span class="term-divider"></span><span class="success">4 demo checks passed</span>\n<span class="dim">※ この出力は作成済みのサンプルです。</span>\n\n<span class="accent">❯</span> <span class="dim">Ready for the next command</span>`;default:return `<span class="dim">~/projects/${name}</span>\n<span class="accent">❯</span> pwd\n/home/dev/projects/${name}\n\n<span class="accent">❯</span> git status --short\n<span class="success"> M</span> App.tsx\n<span class="success"> M</span> docs/PRODUCT.md\n\n<span class="dim"># サンプルのシェルです。\n# help / pwd / git status を試せます。\n# コマンドは実行されません。</span>\n\n<span class="accent">❯</span> <span class="dim">Your workspace is ready.</span>`}}
function keyboard(){return `<div class="keyboard"><div class="keyboard-caption">サンプルキーボード · ネイティブIMEではありません</div>${['qwertyuiop','asdfghjkl','zxcvbnm'].map(row=>`<div class="key-row">${[...row].map(k=>`<button data-action="key" data-value="${k}" aria-label="${k}を入力">${k}</button>`).join('')}</div>`).join('')}<div class="key-row"><button class="utility" data-action="key" data-value="backspace">削除</button><button class="space" data-action="key" data-value="space">space</button><button class="utility" data-action="submit-command">return</button></div></div>`}
function renderTerminal(){const s=getServer(),w=getWorkspace(),p=getPane(),disabled=s.connected?'':'disabled';return `<section class="screen terminal-screen"><header class="term-toolbar">${button('back-workspaces','Workspace一覧へ戻る','back')}<div class="term-heading"><h1 tabindex="-1">${esc(w.name)}</h1><p>${esc(s.name)} / meeterm</p></div>${button('add-pane','新規paneを追加','plus',disabled)}${button('close-pane','現在のpaneを閉じる','close',disabled)}</header><div class="tabs" role="tablist" aria-label="Workspaceのpane">${w.panes.map(tab=>`<button id="tab-${tab.id}" class="tab" role="tab" aria-selected="${p.id===tab.id}" aria-controls="terminal-panel" tabindex="${p.id===tab.id?0:-1}" data-action="select-pane" data-id="${tab.id}"><span class="tab-name">${icon(tab.kind==='shell'?'terminal':tab.kind==='tests'?'check':'spark')}${esc(tab.name)}</span><span class="tab-state ${stateClass(tab.status)}"><span class="dot"></span>${stateLabel[tab.status]}</span></button>`).join('')}</div>${s.connected?'':`<div class="reconnect-banner" role="status">${icon('disconnect')}<span>接続が切れました<br>サーバーの作業は続いています。</span><button data-action="reconnect">再接続</button></div>`}<div id="terminal-panel" class="terminal-output" role="tabpanel" aria-labelledby="tab-${p.id}" tabindex="0">${sampleOutput(p,w)}${p.history.map(h=>`\n\n<span class="accent">❯</span> ${esc(h.command)}\n${esc(h.reply)}`).join('')}</div><div class="term-info"><span>${esc(w.name)} / ${esc(p.name)}</span><span>サンプル出力 · 実接続なし</span></div><form id="command-form" class="command-form"><label for="command-input" class="sr-only">デモコマンド</label><input id="command-input" maxlength="240" value="${esc(p.draft)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="デモ入力…" ${disabled}><button aria-label="デモ入力を送信" type="submit" ${disabled}>${icon('return')}</button></form><div class="keybar" aria-label="補助キー"><button data-action="special" data-value="escape" ${disabled}>Esc</button><button data-action="special" data-value="ctrl" aria-pressed="${ctrl}" ${disabled}>Ctrl</button><button data-action="special" data-value="tab" ${disabled}>Tab</button><button data-action="special" data-value="up" aria-label="前の入力" ${disabled}>↑</button><button data-action="special" data-value="down" aria-label="次の入力" ${disabled}>↓</button><button data-action="keyboard" aria-label="サンプルキーボードを切り替え" aria-pressed="${keyboardOpen}" ${disabled}>${icon('keyboard')}</button></div>${keyboardOpen&&s.connected?keyboard():''}</section>`}
function renderSettings(){return `<section class="screen"><header class="toolbar"><div class="wordmark">${mark}meeterm</div>${button('about','モックについて','info')}</header><div class="scroll"><div class="title-block"><h1 tabindex="-1">自分の手に、なじむ。</h1><p>作業の邪魔をしない、小さな設定。</p></div><div class="section-label">ターミナル</div><div class="content-pad"><div class="settings-group"><div class="setting-row">${icon('type')}<span>文字サイズ</span><div class="stepper"><button data-action="font" data-value="-1" aria-label="文字を小さく" ${fontSize<=10?'disabled':''}>−</button><span>${fontSize}</span><button data-action="font" data-value="1" aria-label="文字を大きく" ${fontSize>=18?'disabled':''}>+</button></div></div><div class="sample-type">❯ いつものWorkspaceへ。<br><span style="opacity:.65">~/projects/meeterm</span></div></div></div><div class="section-label">デモを試す</div><div class="content-pad"><div class="settings-group"><button class="setting-row" data-action="simulate-disconnect">${icon('disconnect')}<span>通信断と再接続<small>作業を残したまま接続が切れる場面</small></span><span class="tail">${icon('arrow')}</span></button><button class="setting-row" data-action="reset">${icon('refresh')}<span>モックを初期状態に戻す<small>追加したサンプルデータをリセット</small></span><span class="tail">${icon('arrow')}</span></button></div><div class="settings-group"><button class="setting-row" data-action="about">${icon('info')}<span>このモックについて</span><span class="tail">${icon('arrow')}</span></button></div><div class="about-brand">${mark}</div><div class="settings-about">meeterm<br>A quiet companion for your workspace.<br><span class="mono">DESIGN STUDY / 01</span></div></div></div>${bottomNav('settings')}</section>`}
function render(){let page=route();if(page==='terminal'&&!getPane()){navigate('workspaces');return}document.documentElement.style.setProperty('--term-size',`${fontSize}px`);app.innerHTML=({servers:renderServers,workspaces:renderWorkspaces,terminal:renderTerminal,settings:renderSettings}[page])();document.querySelectorAll('.journey button').forEach(b=>{if(b.dataset.value===page)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});if(page==='terminal')document.querySelector('.tab[aria-selected=true]')?.scrollIntoView({block:'nearest',inline:'nearest'});document.title=`meeterm · ${{servers:'接続先',workspaces:'Workspaces',terminal:getWorkspace()?.name,settings:'設定'}[page]}`}
function openSheet(title,body,actions=''){sheet.innerHTML=`<div class="dialog-inner"><div class="dialog-top"><h2 id="sheet-title">${esc(title)}</h2>${button('dismiss','ダイアログを閉じる','close')}</div>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}</div>`;if(!sheet.open)sheet.showModal()}
const dismiss=()=>sheet.close();
function enterServer(id){const s=servers.find(s=>s.id===id);if(!s)return;serverId=s.id;if(!s.known){openSheet('ホスト鍵を確認',`<p class="dialog-description">初回接続では、サーバー側の鍵と照合します。<br>これはデモ用の確認画面です。</p><div class="fingerprint">${esc(s.address)}:${s.port}<br>ED25519<br>SHA256:DEMO-FINGERPRINT-NOT-A-REAL-KEY</div><p class="field-hint">認証情報の入力や実際の接続は行いません。</p>`,`<button class="primary" data-action="trust-host">確認して接続（デモ）</button><button class="secondary" data-action="dismiss">キャンセル</button>`);return}s.connected=true;if(!s.windows.find(w=>w.id===workspaceId))workspaceId=s.windows[0]?.id||'';navigate('workspaces')}
function addNameForm(kind){const isPane=kind==='pane',title=isPane?'新しいpane':'新しいWorkspace';openSheet(title,`<p class="dialog-description">${isPane?'今のWorkspaceに、もうひとつの作業場所を。':'同じmeetermセッションに作業場所を追加します。'}</p><form id="name-form" data-kind="${kind}"><label for="new-name">${isPane?'pane':'Workspace'}名</label><input id="new-name" class="field" name="name" required maxlength="48" placeholder="${isPane?'Shell':'my-project'}" value="${isPane?'Shell':''}" autofocus><p class="field-hint">このモック内だけに追加されます。</p><div class="dialog-actions"><button class="primary" type="submit">${isPane?'pane':'Workspace'}を追加</button></div></form>`)}
function sendCommand(){const p=getPane(),w=getWorkspace();if(!p||!getServer().connected)return;const raw=document.getElementById('command-input')?.value??p.draft;const command=raw.trim();if(!command)return;const replies={help:'デモコマンド: help / pwd / git status\n入力と出力はこのpane内だけに保持します。',pwd:`/home/dev/projects/${w.name}`,'git status':'On branch mock/design-study\nChanges not staged for commit:\n  modified: App.tsx\n（作成済みのデモ出力）'};p.history.push({command,reply:replies[command]||`「${command}」をデモ入力として受け取りました。\nコマンドの実行・ネットワーク送信はしていません。`});if(p.history.length>50)p.history.shift();p.historyIndex=p.history.length;p.draft='';ctrl=false;render();document.getElementById('terminal-panel').scrollTop=100000;document.getElementById('command-input').focus()}
function demoTerminal(){const s=getServer();if(!getPane()){workspaceId=s.windows[0]?.id||''}if(!getPane()){navigate('workspaces');toast('まずWorkspaceを追加してください');return false}return true}
document.addEventListener('click',event=>{const target=event.target.closest('button[data-action]');if(!target||target.disabled)return;const {action,value,id}=target.dataset;const s=getServer(),w=getWorkspace(),p=getPane();switch(action){
case 'navigate':navigate(value);break;
case 'scene':if(value==='terminal'){if(!demoTerminal())break;s.connected=true}if(value==='workspaces')s.connected=true;navigate(value);break;
case 'connect':enterServer(id);break;
case 'trust-host':s.known=true;dismiss();enterServer(s.id);break;
case 'open-workspace':workspaceId=id;s.lastWorkspace=id;navigate('terminal');break;
case 'back-workspaces':navigate('workspaces');break;
case 'add-host':openSheet('接続先を追加',`<p class="dialog-description">デモ用の接続先を作成します。<br>実際の認証情報は入力しないでください。</p><form id="host-form"><label for="host-name">表示名</label><input class="field" id="host-name" name="name" placeholder="My server" maxlength="48" required autofocus><label for="host-address">ホスト名</label><input class="field" id="host-address" name="address" placeholder="server.example" maxlength="120" required autocapitalize="off" spellcheck="false"><div class="form-pair"><div><label for="host-user">ユーザー名</label><input class="field" id="host-user" name="user" value="dev" maxlength="48" required autocapitalize="off"></div><div><label for="host-port">ポート</label><input class="field" id="host-port" name="port" type="number" value="22" min="1" max="65535" required></div></div><p class="field-hint">秘密鍵・パスワードは扱いません。<br>データは再読み込みで消えます。</p><div class="dialog-actions"><button class="primary" type="submit">デモ接続先を追加</button></div></form>`);break;
case 'add-workspace':if(s.connected)addNameForm('workspace');break;
case 'add-pane':if(s.connected)addNameForm('pane');break;
case 'select-pane':if(w?.panes.some(item=>item.id===id)){w.active=id;ctrl=false;render();document.getElementById(`tab-${id}`)?.focus({preventScroll:true})}break;
case 'close-pane':if(!p||!s.connected)break;openSheet('paneを閉じますか？',`<p class="dialog-description">「${esc(p.name)}」を終了します。<br>実際のアプリでは、実行中のプロセスも終了します。</p>${w.panes.length===1?'<div class="dialog-alert">最後のpaneです。このpaneを閉じると、Workspaceも終了します。</div>':'<p class="small-note">ほかのpaneはそのまま残ります。</p>'}`,`<button class="primary danger" data-action="confirm-close">paneを閉じる</button><button class="secondary" data-action="dismiss">キャンセル</button>`);break;
case 'confirm-close':if(!w||!p||!s.connected)break;w.panes=w.panes.filter(item=>item.id!==p.id);dismiss();if(w.panes.length){w.active=w.panes[0].id;render()}else{s.windows=s.windows.filter(item=>item.id!==w.id);workspaceId=s.windows[0]?.id||'';navigate('workspaces')}toast('デモのpaneを閉じました');break;
case 'keyboard':keyboardOpen=!keyboardOpen;render();break;
case 'key':if(!p||!s.connected)break;p.draft=(value==='backspace'?[...p.draft].slice(0,-1).join(''):p.draft+(value==='space'?' ':value)).slice(0,240);document.getElementById('command-input').value=p.draft;break;
case 'submit-command':sendCommand();break;
case 'special':if(!p||!s.connected)break;if(value==='ctrl'){ctrl=!ctrl;target.setAttribute('aria-pressed',String(ctrl));toast(ctrl?'Ctrlを選択しました（デモ）':'Ctrlを解除しました')}else if(value==='escape'){keyboardOpen=false;ctrl=false;render();toast('Esc（デモ）')}else if(value==='tab'){p.draft=(p.draft+'  ').slice(0,240);document.getElementById('command-input').value=p.draft}else{p.historyIndex=Math.max(0,Math.min(p.history.length,p.historyIndex+(value==='up'?-1:1)));p.draft=p.history[p.historyIndex]?.command||'';document.getElementById('command-input').value=p.draft}break;
case 'connection':openSheet('サーバーとの接続',`<p class="dialog-description">${esc(s.name)} · ${s.connected?'接続中':'未接続'}（デモ）<br>接続を切ってもWorkspaceやpaneは残ります。</p><div class="fingerprint">PCで再開するコマンド<br>tmux attach -t meeterm</div>`,`<button class="primary" data-action="${s.connected?'detach':'reconnect'}">${s.connected?'接続を切る（デモ）':'再接続（デモ）'}</button><button class="secondary" data-action="dismiss">閉じる</button>`);break;
case 'detach':s.connected=false;dismiss();navigate('servers');toast('作業を残して接続を切りました（デモ）');break;
case 'reconnect':s.connected=true;dismiss();render();toast('同じWorkspaceに戻りました（デモ）');break;
case 'simulate-disconnect':if(demoTerminal()){s.connected=false;navigate('terminal')}break;
case 'font':fontSize=Math.min(18,Math.max(10,fontSize+Number(value)));render();break;
case 'reset':openSheet('モックをリセット',`<p class="dialog-description">追加した接続先・Workspace・paneと入力履歴を消し、最初のデモに戻します。</p>`,`<button class="primary" data-action="confirm-reset">リセットする</button><button class="secondary" data-action="dismiss">キャンセル</button>`);break;
case 'confirm-reset':servers=seed();serverId='home';workspaceId='meeterm';seq=20;fontSize=12;dismiss();navigate('servers');toast('モックを初期状態に戻しました');break;
case 'about':openSheet('meeterm / Design study 01',`<p class="dialog-description">接続先 → Workspace → paneの操作を確認するための、独立したデザインモックです。</p><div class="dialog-alert">実際のSSH接続・コマンド実行・Codexの状態検出は行いません。ターミナルはサンプル文面です。</div><p class="field-hint">1 SSH先につき、meetermセッションはひとつ。Workspaceはtmux window、paneはタブとして表示します。<br><br>入力はメモリ内だけに保持し、再読み込みで消えます。実際の認証情報は入力しないでください。<br><br>本体のRust・ネイティブ端末には接続していません。このHTMLを本体のWebView端末に転用する意図はありません。<br><br>参考：AppllamaのTermius / Host Management、Todoist / BrowseのUI要素・配色メタデータ。参考画面の画像は再配布していません。</p>`,`<button class="primary" data-action="dismiss">モックに戻る</button>`);break;
case 'dismiss':dismiss();break;
}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(form.id==='command-form'){sendCommand();return}const data=new FormData(form),name=String(data.get('name')||'').trim();if(!name){form.querySelector('[name=name]')?.setCustomValidity('名前を入力してください');form.reportValidity();return}if(form.id==='host-form'){const address=String(data.get('address')||'').trim(),user=String(data.get('user')||'').trim(),port=Number(data.get('port'));if(!address||!user||!Number.isInteger(port)||port<1||port>65535)return;servers.push({id:`host${++seq}`,name,address,user,port,known:false,connected:false,windows:[]});dismiss();navigate('servers');toast('デモ接続先を追加しました')}else if(form.id==='name-form'){const s=getServer();if(!s.connected)return;const newPane=pane(`p${++seq}`,form.dataset.kind==='pane'?name:'Shell','idle','shell');if(form.dataset.kind==='pane'){const w=getWorkspace();if(!w)return;w.panes.push(newPane);w.active=newPane.id;dismiss();render();toast('paneを追加しました')}else{const w={id:`w${++seq}`,name,active:newPane.id,panes:[newPane]};s.windows.push(w);workspaceId=w.id;s.lastWorkspace=w.id;dismiss();navigate('terminal');toast('Workspaceを追加しました')}}});
document.addEventListener('input',event=>{if(event.target.id==='command-input'&&getPane()){getPane().draft=event.target.value;if(ctrl){ctrl=false;document.querySelector('[data-value=ctrl]')?.setAttribute('aria-pressed','false');toast('Ctrlとの組み合わせは表示デモのみです')}}if(event.target.name==='name')event.target.setCustomValidity('')});
document.addEventListener('keydown',event=>{if(event.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const w=getWorkspace();const i=w.panes.findIndex(p=>p.id===w.active);const next=event.key==='Home'?0:event.key==='End'?w.panes.length-1:(i+(event.key==='ArrowRight'?1:-1)+w.panes.length)%w.panes.length;w.active=w.panes[next].id;render();document.getElementById(`tab-${w.active}`).focus({preventScroll:true})}});
sheet.addEventListener('click',event=>{if(event.target===sheet){const r=sheet.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dismiss()}});
window.addEventListener('hashchange',()=>{render();app.querySelector('h1')?.focus({preventScroll:true})});
render();
</script>
