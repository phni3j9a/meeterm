name: Disposable iOS storage reproduction
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the disposable probe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Record Xcode Mach-O section tool availability
        shell: bash
        run: |
          set -u
          if objcopy=$(xcrun --find llvm-objcopy 2>/tmp/meeterm-objcopy-error); then
            echo "PROBE llvm_objcopy=available path=$objcopy"
            "$objcopy" --version | head -n 1
          else
            echo 'PROBE llvm_objcopy=unavailable'
            cat /tmp/meeterm-objcopy-error
          fi

      - name: Run app-hosted unsigned XCTest Keychain probe
        shell: bash
        run: |
          set -euo pipefail
          cat > runner-host-entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>application-identifier</key><string>MEETERMCI.dev.meeterm.runner-probe</string>
          <key>keychain-access-groups</key><array><string>MEETERMCI.dev.meeterm.runner-probe</string></array>
          </dict></plist>
          PLIST
          /usr/bin/derq query -f xml -i runner-host-entitlements.plist -o runner-host-entitlements.der --raw

          derived_data=/tmp/meeterm-host-probe-derived
          rm -rf "$derived_data" /tmp/meeterm-host-probe.xcresult
          xcodebuild \
            -project RunnerKeychainProbe.xcodeproj \
            -scheme RunnerKeychainProbe \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build-for-testing | tee /tmp/meeterm-host-probe-build.log

          products="$derived_data/Build/Products"
          xctestrun=$(find "$products" -maxdepth 1 -name '*.xctestrun' -type f -print -quit)
          host="$products/Release-iphonesimulator/RunnerHost.app/RunnerHost"
          test_bundle="$products/Release-iphonesimulator/RunnerKeychainTests-Runner.app/PlugIns/RunnerKeychainTests.xctest/RunnerKeychainTests"
          test_runner="$products/Release-iphonesimulator/RunnerKeychainTests-Runner.app/RunnerKeychainTests-Runner"
          test -n "$xctestrun"
          test -x "$host"
          test -x "$test_bundle"
          test -x "$test_runner"
          echo "PROBE xctestrun=$xctestrun"
          echo "PROBE host=$host"
          echo "PROBE test_bundle=$test_bundle"
          echo "PROBE test_runner=$test_runner"

          xcrun otool -l "$host" > /tmp/meeterm-host-probe-host-otool.txt
          grep -q 'sectname __entitlements' /tmp/meeterm-host-probe-host-otool.txt
          grep -q 'sectname __ents_der' /tmp/meeterm-host-probe-host-otool.txt
          echo 'PROBE host_sections=passed'

          probe_udid=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$probe_udid" 2>/dev/null || true
          xcrun simctl bootstatus "$probe_udid" -b

          set +e
          xcodebuild \
            test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$probe_udid" \
            -resultBundlePath /tmp/meeterm-host-probe.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            > /tmp/meeterm-host-probe-test.log 2>&1
          test_status=$?
          set -e
          cat /tmp/meeterm-host-probe-test.log
          grep -q 'PROBE host_keychain_add=0' /tmp/meeterm-host-probe-test.log
          grep -q 'PROBE host_keychain_delete=0' /tmp/meeterm-host-probe-test.log
          test "$test_status" -eq 0
          echo 'PROBE host_keychain=passed'
