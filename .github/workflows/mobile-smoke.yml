name: Mobile smoke

on:
  push:
    branches:
      - "**"
    paths:
      - "App.tsx"
      - "app/**"
      - "app.json"
      - "assets/**"
      - "babel.config.*"
      - "index.ts"
      - "metro.config.js"
      - "package.json"
      - "package-lock.json"
      - "modules/**"
      - "native/**"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        type: choice
        options: [both, android, ios]
        default: both
      ios_suite:
        description: iOS scope (standard is the daily smoke; ssh is short optional input)
        type: choice
        options: [standard, ssh, full, forms, native, names]
        default: standard
      ios_build_run:
        description: Optional exact-commit Mobile smoke run containing ios-test-products
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-smoke-${{ github.ref }}-${{ inputs.platform || 'both' }}-${{ inputs.ios_suite || 'standard' }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.2
  NPM_VERSION: 10.9.7
  RUST_VERSION: 1.96.0
  CARGO_NDK_VERSION: 4.1.2
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_FALLBACK_BUILD_TOOLS: 35.0.0
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_NDK_VERSION: 27.1.12297006

jobs:
  android-emulator:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'ios' }}
    name: Android emulator / native frame
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize Android evidence directory
        run: |
          mkdir -p artifacts/android-emulator-observability
          {
            echo "runner=${RUNNER_NAME}"
            echo "os=${RUNNER_OS}"
            echo "arch=${RUNNER_ARCH}"
            echo "commit=${GITHUB_SHA}"
          } > artifacts/android-emulator-observability/metadata.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm and install JavaScript dependencies
        run: |
          npm install --global npm@"${NPM_VERSION}"
          npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned Android native toolchain
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "build-tools;${ANDROID_FALLBACK_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install pinned Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup target add --toolchain "${RUST_VERSION}" x86_64-linux-android aarch64-linux-android
          cargo +"${RUST_VERSION}" install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: Generate Android project with Expo CNG
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Assemble self-contained Android smoke app
        working-directory: android
        env:
          NODE_ENV: production
          EXPO_PUBLIC_MEETERM_SMOKE: "1"
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64 \
            -PmeetermRustProfile=release \
            --no-daemon --stacktrace \
            2>&1 | tee ../artifacts/android-emulator-observability/gradle-build.log

      - name: Preserve APK and reclaim build-only disk space
        run: |
          set -Eeuo pipefail
          : "${GITHUB_WORKSPACE:?GITHUB_WORKSPACE must be set}"
          : "${ANDROID_HOME:?ANDROID_HOME must be set}"
          readonly evidence_dir="${GITHUB_WORKSPACE}/artifacts/android-emulator-observability"
          readonly ndk_dir="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          readonly cmake_dir="${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"
          readonly dotnet_dir="/usr/share/dotnet"
          readonly ghc_dir="/opt/ghc"
          readonly codeql_dir="/opt/hostedtoolcache/CodeQL"

          test -f "${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release/app-release.apk"
          cp \
            "${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release/app-release.apk" \
            "${evidence_dir}/app-release.apk"
          {
            echo "before_cleanup"
            df -h "${GITHUB_WORKSPACE}"
            du -sh \
              "${GITHUB_WORKSPACE}/android" \
              "${GITHUB_WORKSPACE}/node_modules" \
              "${GITHUB_WORKSPACE}/native/meeterm-core/target" \
              "${ndk_dir}" \
              "${cmake_dir}"
            for runner_tool_dir in "${dotnet_dir}" "${ghc_dir}" "${codeql_dir}"; do
              if [[ -d "${runner_tool_dir}" ]]; then
                sudo du -sh "${runner_tool_dir}"
              fi
            done
          } > "${evidence_dir}/disk-space.txt"

          rm -rf \
            "${GITHUB_WORKSPACE}/android" \
            "${GITHUB_WORKSPACE}/node_modules" \
            "${GITHUB_WORKSPACE}/native/meeterm-core/target" \
            "${ndk_dir}" \
            "${cmake_dir}"

          # These preinstalled SDKs are unrelated to this ephemeral Android job.
          # Removing only these exact paths leaves enough room for the API image
          # and its writable AVD without weakening the native build checks above.
          for runner_tool_dir in "${dotnet_dir}" "${ghc_dir}" "${codeql_dir}"; do
            if [[ -d "${runner_tool_dir}" ]]; then
              sudo rm -rf -- "${runner_tool_dir}"
            fi
          done

          {
            echo "after_cleanup"
            df -h "${GITHUB_WORKSPACE}"
          } >> "${evidence_dir}/disk-space.txt"

      - name: Enable KVM access
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Boot emulator and verify the native terminal frame
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            scripts/ci/android-smoke.sh
            python3 scripts/ci/android-screen-fixtures.py --artifact-dir artifacts/android-emulator-observability
            python3 scripts/ssh/fixture.py -- python3 scripts/ssh/android-smoke.py --artifact-dir artifacts/android-emulator-observability

      - name: Record unavailable Android evidence
        if: always()
        run: scripts/ci/finalize-evidence.sh android-emulator-observability

      - name: Upload Android observability artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-emulator-observability
          path: artifacts/android-emulator-observability
          if-no-files-found: error
          retention-days: 14

  ios-driver-check:
    name: iOS driver / fast typecheck
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform != 'android' }}
    runs-on: macos-26-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7


      - name: Check iOS driver and reusable product regressions
        run: |
          scripts/ci/ios-collect-artifacts-test.sh
          python3 -m unittest discover -s scripts/ssh -p 'test_ios_smoke.py'
          python3 scripts/ci/test_ios_test_products.py

      - name: Typecheck XCTest and native input sources without app build
        run: scripts/ci/ios-typecheck.sh

  ios-build:
    name: iOS / fresh CNG build
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    needs: ios-driver-check
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.platform != 'android') && !inputs.ios_build_run }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize iOS evidence directory
        run: |
          mkdir -p artifacts/ios-build-observability
          {
            echo "runner=${RUNNER_NAME}"
            echo "os=${RUNNER_OS}"
            echo "arch=${RUNNER_ARCH}"
            echo "commit=${GITHUB_SHA}"
          } > artifacts/ios-build-observability/metadata.txt

      - name: Record pinned Xcode
        run: |
          xcodebuild -version | tee artifacts/ios-build-observability/xcode-version.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm and install JavaScript dependencies
        run: |
          npm install --global npm@"${NPM_VERSION}"
          npm ci

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup target add --toolchain "${RUST_VERSION}" x86_64-apple-ios

      - name: Generate iOS project with Expo CNG
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Inject disposable iOS test targets
        run: scripts/ci/ios-inject-ui-test.sh

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Keep storage tests linked through the app host
        run: python3 scripts/ci/ios-strip-storage-rust-link.py

      - name: Verify app-hosted storage source isolation
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const project = require('xcode').project('ios/meeterm.xcodeproj/project.pbxproj');
          project.parseSync();
          const objects = project.hash.project.objects;
          const unquote = value => String(value).replace(/^"|"$/g, '');
          const targets = Object.entries(objects.PBXNativeTarget)
            .filter(([id]) => !id.endsWith('_comment')).map(([, target]) => target);
          const app = targets.find(target => unquote(target.name) === 'meeterm');
          const storage = targets.find(target => unquote(target.name) === 'meetermStorageTests');
          assert(app && storage, 'Expected app and storage targets');
          const sources = target => target.buildPhases
            .map(phase => objects.PBXSourcesBuildPhase[phase.value]).filter(Boolean)
            .flatMap(phase => phase.files.map(file => objects.PBXBuildFile[file.value].fileRef))
            .map(id => path.basename(unquote(objects.PBXFileReference[id].path)));
          assert.deepEqual(sources(storage), ['ClientStoreTests.swift']);
          assert.equal(sources(app).filter(name => name === 'ExpoModulesProvider.swift').length, 1);
          for (const configuration of ['debug', 'release']) {
            const config = fs.readFileSync(
              `ios/Pods/Target Support Files/Pods-meetermStorageTests/Pods-meetermStorageTests.${configuration}.xcconfig`, 'utf8');
            const flags = config.split('\n').filter(line => /^OTHER_LDFLAGS\s*=/.test(line));
            assert.equal(flags.length, 1, 'Expected one storage linker flags definition');
            assert(!flags.some(line => /MeetermTerminal|meeterm_core/.test(line)),
              'Storage tests must resolve the production module through their app host');
            const appConfig = fs.readFileSync(
              `ios/Pods/Target Support Files/Pods-meeterm/Pods-meeterm.${configuration}.xcconfig`, 'utf8');
            assert(appConfig.split('\n').some(line => /^OTHER_LDFLAGS\s*=/.test(line)
              && line.includes('-l"meeterm_core"')),
              'The app host must retain the production Rust library link');
          }
          fs.writeFileSync('artifacts/ios-build-observability/ios-storage-source-isolation.txt',
            'app_provider=single\nstorage_sources=isolated\nstorage_direct_native_link=absent\n');
          JS

      - name: Build unsigned self-contained iOS smoke app and UI test
        env:
          NODE_ENV: production
          EXPO_PUBLIC_MEETERM_SMOKE: "1"
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/meeterm.xcworkspace \
            -scheme meeterm \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/meeterm-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_TESTABILITY=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=x86_64 \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing \
            2>&1 | tee artifacts/ios-build-observability/xcodebuild.log

      - name: Verify Simulator Keychain entitlement sections
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          products = Path(os.environ["RUNNER_TEMP"]) / "meeterm-derived-data/Build/Products/Release-iphonesimulator"
          executables = {
              "app": products / "meeterm.app/meeterm",
          }
          lines = []
          valid = True
          for target, executable in executables.items():
              result = subprocess.run(["xcrun", "otool", "-l", str(executable)],
                                      capture_output=True, text=True, check=False, timeout=30)
              for section in ("__entitlements", "__ents_der"):
                  present = result.returncode == 0 and re.search(
                      rf"sectname {section}\s+segname __TEXT(?:\s|$)", result.stdout) is not None
                  lines.append(f"target={target} section={section} present={int(present)}")
                  valid = valid and present
          lines.append(f"result={'passed' if valid else 'failed'}")
          Path("artifacts/ios-build-observability/ios-simulator-entitlements.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8")
          if not valid:
              raise SystemExit("The unsigned Simulator app host lacks Keychain entitlement sections.")
          PY

      - name: Package pristine test products before fixture injection
        run: |
          python3 scripts/ci/ios-test-products.py pack \
            --products "${RUNNER_TEMP}/meeterm-derived-data/Build/Products" \
            --package "${RUNNER_TEMP}/ios-test-products" \
            --source-sha "${GITHUB_SHA}" \
            --xcode-version-file artifacts/ios-build-observability/xcode-version.txt

      - name: Upload reusable exact-source test products
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-test-products
          path: ${{ runner.temp }}/ios-test-products
          if-no-files-found: error
          retention-days: 7

      - name: Record build-only evidence boundary
        if: always()
        run: scripts/ci/finalize-evidence.sh ios-build-observability

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-build-observability
          path: artifacts/ios-build-observability
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator / ${{ inputs.ios_suite || 'standard' }}
    needs: [ios-driver-check, ios-build]
    if: ${{ always() && !cancelled() && needs.ios-driver-check.result == 'success' && (needs.ios-build.result == 'success' || (needs.ios-build.result == 'skipped' && inputs.ios_build_run != '')) }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MEETERM_IOS_SUITE: ${{ inputs.ios_suite || 'standard' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize iOS evidence directory
        run: |
          mkdir -p artifacts/ios-simulator-observability
          {
            echo "runner=${RUNNER_NAME}"
            echo "os=${RUNNER_OS}"
            echo "arch=${RUNNER_ARCH}"
            echo "commit=${GITHUB_SHA}"
          } > artifacts/ios-simulator-observability/metadata.txt

      - name: Record pinned Xcode
        run: |
          xcodebuild -version | tee artifacts/ios-simulator-observability/xcode-version.txt

      - name: Restore matching pristine test products
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.ios_build_run || github.run_id }}
        run: |
          set -Eeuo pipefail
          [[ "${SOURCE_RUN}" =~ ^[0-9]+$ ]]
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.head_sha')"
          source_workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}" --jq '.path')"
          [[ "${source_sha}" == "${GITHUB_SHA}" ]]
          [[ "${source_workflow}" == '.github/workflows/mobile-smoke.yml' ]]
          gh run download "${SOURCE_RUN}" --repo "${GITHUB_REPOSITORY}" \
            --name ios-test-products --dir "${RUNNER_TEMP}/ios-test-products"
          python3 scripts/ci/ios-test-products.py restore \
            --package "${RUNNER_TEMP}/ios-test-products" \
            --destination "${RUNNER_TEMP}/meeterm-derived-data/Build" \
            --source-sha "${GITHUB_SHA}" \
            --xcode-version-file artifacts/ios-simulator-observability/xcode-version.txt
          {
            echo "test_scope=${MEETERM_IOS_SUITE}"
            echo "build_source_run=${SOURCE_RUN}"
            echo "build_source_commit=${source_sha}"
            if [[ "${SOURCE_RUN}" == "${GITHUB_RUN_ID}" ]]; then
              echo 'build_mode=fresh-cng'
            else
              echo 'build_mode=reused-exact-source-diagnostic'
            fi
          } >> artifacts/ios-simulator-observability/metadata.txt

      - name: Install fixture-only tmux
        if: env.MEETERM_IOS_SUITE == 'ssh' || env.MEETERM_IOS_SUITE == 'full' || env.MEETERM_IOS_SUITE == 'names'
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux
          fi
          tmux -V

      - name: Verify real OpenSSH fixture before SSH runtime testing
        if: env.MEETERM_IOS_SUITE == 'ssh' || env.MEETERM_IOS_SUITE == 'full' || env.MEETERM_IOS_SUITE == 'names'
        run: |
          test -x /usr/sbin/sshd
          command -v ssh-keygen
          test "$(id -u)" -ne 0
          python3 scripts/ssh/fixture.py --check

      - name: Boot an available iPhone Simulator
        run: scripts/ci/ios-select-simulator.sh

      - name: Record Metal availability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          output_path = Path("artifacts/ios-simulator-observability/metal-preflight.txt")
          try:
              result = subprocess.run(
                  [
                      "swift",
                      "-e",
                      'import Metal; print(MTLCreateSystemDefaultDevice() == nil ? "unavailable" : "available")',
                  ],
                  capture_output=True,
                  text=True,
                  timeout=30,
                  check=False,
              )
              output = result.stdout + result.stderr
              if result.returncode != 0:
                  output += f"preflight-exit={result.returncode}\n"
          except subprocess.TimeoutExpired:
              output = "preflight-timeout-after-30s\n"
          output_path.write_text(output or "preflight-produced-no-output\n", encoding="utf-8")
          PY

      - name: Run selected iOS UI smoke
        run: scripts/ci/ios-smoke.sh

      - name: Collect iOS Simulator observability
        if: always()
        run: scripts/ci/ios-collect-artifacts.sh

      - name: Record unavailable iOS evidence
        if: always()
        run: scripts/ci/finalize-evidence.sh ios-simulator-observability

      - name: Upload iOS observability artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-simulator-observability
          path: artifacts/ios-simulator-observability
          if-no-files-found: error
          retention-days: 14
