name: Android foundation input probe

on:
  workflow_dispatch:
    inputs:
      source_artifact_id:
        description: Existing Android APK artifact ID
        required: true
        default: "10139943289"
        type: string
      source_run_id:
        description: Source run ID recorded with the APK evidence
        required: true
        default: "34444865747"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-foundation-input-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: android-36

jobs:
  foundation-input-copy:
    name: Android foundation input and copy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize probe artifacts
        run: mkdir -p artifacts/android-emulator-observability artifacts/android-foundation-copy-probe

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install pinned emulator image
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "system-images;${ANDROID_PLATFORM};google_apis;x86_64"

      - name: Download the existing APK artifact
        env:
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          readonly archive="${RUNNER_TEMP}/android-observability.zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output "${archive}"
          python3 - "${archive}" "artifacts/android-emulator-observability/app-release.apk" "${SOURCE_RUN_ID}" "${SOURCE_ARTIFACT_ID}" <<'PY'
          from pathlib import Path
          import sys
          import zipfile

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          source_run = sys.argv[3]
          source_artifact = sys.argv[4]
          with zipfile.ZipFile(archive) as bundle:
              matches = [name for name in bundle.namelist() if name == "app-release.apk" or name.endswith("/app-release.apk")]
              if len(matches) != 1:
                  raise SystemExit("APK artifact did not contain exactly one app-release.apk")
              output.write_bytes(bundle.read(matches[0]))
          if output.stat().st_size < 1024:
              raise SystemExit("APK artifact is unexpectedly small")
          Path("artifacts/android-foundation-copy-probe/source.txt").write_text(
              f"source_artifact_id={source_artifact}\n"
              f"source_run_id={source_run}\n",
              encoding="utf-8",
          )
          PY

      - name: Enable KVM access
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Boot emulator and run foundation probe
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            scripts/ci/android-smoke.sh
            smoke_status=$?
            python3 scripts/ssh/android_foundation_copy_probe.py \
              --artifact-dir artifacts/android-foundation-copy-probe
            probe_status=$?
            set -e
            {
              echo "smoke_status=${smoke_status}"
              echo "probe_status=${probe_status}"
            } > artifacts/android-foundation-copy-probe/status.txt
            if (( smoke_status != 0 || probe_status != 0 )); then
              exit 1
            fi

      - name: Upload foundation probe artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-foundation-copy-probe
          path: |
            artifacts/android-emulator-observability
            artifacts/android-foundation-copy-probe
          if-no-files-found: error
          retention-days: 7
