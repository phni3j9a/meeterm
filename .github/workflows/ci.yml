name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.2
  NPM_VERSION: 10.9.7
  RUST_VERSION: 1.96.0
  CARGO_NDK_VERSION: 4.1.2
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  ANDROID_FALLBACK_BUILD_TOOLS: 35.0.0
  ANDROID_CMAKE_VERSION: 3.22.1
  ANDROID_NDK_VERSION: 27.1.12297006

jobs:
  ios-driver:
    name: iOS driver fast typecheck
    runs-on: macos-26-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check evidence collector with the macOS system Bash
        run: scripts/ci/ios-collect-artifacts-test.sh
      - name: Typecheck XCTest and native input sources without building the app
        run: scripts/ci/ios-typecheck.sh

  javascript:
    name: JavaScript and Expo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@"${NPM_VERSION}"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check App snapshot and terminal selection transitions
        run: npm run test:app

      - name: Check iOS Simulator entitlement generation
        run: python3 scripts/ci/test_ios_simulator_entitlements.py

      - name: Check iOS app-hosted storage linker isolation
        run: python3 scripts/ci/test_ios_strip_storage_rust_link.py

      - name: Check portable exact-source iOS test products
        run: python3 scripts/ci/test_ios_test_products.py

      - name: Validate Expo configuration
        run: npx expo config --type public >/tmp/meeterm-expo-config.json

      - name: Run Expo doctor
        run: npx --yes expo-doctor@1.20.4

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component rustfmt,clippy --no-self-update
          rustup default "${RUST_VERSION}"

      - name: Check SSH smoke driver regressions
        run: |
          python3 -m unittest discover -s scripts/ssh -p 'test_*.py'
          python3 -m unittest discover -s scripts/herdr -p 'test_*.py'
          scripts/ci/ios-collect-artifacts-test.sh
          command -v tmux
          tmux -V

      - name: Format check
        working-directory: native/meeterm-core
        run: cargo fmt --check

      - name: Unit tests
        working-directory: native/meeterm-core
        run: cargo test --locked

      - name: Real OpenSSH PTY integration
        run: |
          python3 scripts/ssh/fixture.py -- \
            cargo test --locked --manifest-path native/meeterm-core/Cargo.toml \
            --test openssh real_openssh_tmux_session_loop -- --ignored --nocapture

      - name: Clippy
        working-directory: native/meeterm-core
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Real Herdr native integration through the test SSH endpoint
        env:
          MEETERM_HERDR_INTEGRATION: "1"
        run: |
          export MEETERM_HERDR_BINARY="${RUNNER_TEMP}/herdr-0.9.0-fixture"
          curl --fail --location --silent --show-error \
            https://github.com/herdrdev/herdr/releases/download/v0.9.0/herdr-linux-x86_64 \
            --output "${MEETERM_HERDR_BINARY}"
          echo "4fa1a01158dd8043da92d31b270780b0dcc10603038d9b61cac4d81ab63fb71f  ${MEETERM_HERDR_BINARY}" | sha256sum --check
          chmod 700 "${MEETERM_HERDR_BINARY}"
          cargo test --locked --manifest-path native/meeterm-core/Cargo.toml \
            --test herdr -- --ignored --nocapture

  android:
    name: Android native build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Keep Rust debug assertions for the debug variant, but omit DWARF data
    # from the dev-profile native libraries built by Gradle for both ABIs.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@"${NPM_VERSION}"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android packages
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "build-tools;${ANDROID_FALLBACK_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install pinned Rust toolchain and cargo-ndk
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup target add --toolchain "${RUST_VERSION}" \
            aarch64-linux-android x86_64-linux-android
          cargo +"${RUST_VERSION}" install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: Build Rust Android targets
        working-directory: native/meeterm-core
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 24 \
            build --locked --release

      - name: Generate Android project with Expo CNG
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Assemble Android debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Run native module unit tests when the generated task exists
        working-directory: android
        run: |
          tasks="$(./gradlew tasks --all --no-daemon)"
          if grep -Eq "(^|:)meeterm-terminal:testDebugUnitTest([[:space:]]|$)" <<<"${tasks}"; then
            ./gradlew :meeterm-terminal:testDebugUnitTest --no-daemon --stacktrace
          else
            echo "No :meeterm-terminal:testDebugUnitTest task was generated; no native-module Android unit tests are present in this PoC."
          fi
          if grep -Eq "(^|:)app:testDebugUnitTest([[:space:]]|$)" <<<"${tasks}"; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            echo "No :app:testDebugUnitTest task was generated; no app Android unit tests are present in this PoC."
          fi
